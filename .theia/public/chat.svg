<?xml version="1.0" encoding="UTF-8"?>
<!-- Chat logo SVG -->
<svg xmlns="http://www.w3.org/2000/svg" width="400" height="400" viewBox="0 0 1200 800">
  <defs>
	<linearGradient id="g" x1="0" x2="0" y1="0" y2="1">
	  <stop offset="0%" stop-color="#1e5799"/>
	  <stop offset="100%" stop-color="#2989d8"/>
	</linearGradient>
	<filter id="f" x="-20%" y="-20%" width="140%" height="140%">
	  <feDropShadow dx="0" dy="10" stdDeviation="20" flood-opacity="0.25"/>
	</filter>
  </defs>

  <!-- Rounded background -->
  <rect width="1200" height="800" rx="40" fill="url(#g)" />

  <!-- White panel -->
  <rect x="120" y="100" width="960" height="520" rx="30" fill="#ffffff" opacity="0.95" filter="url(#f)" />

  <!-- Left chat bubble -->
  <g transform="translate(220,180)">
	<path d="M0 120 q0 -60 60 -60 h380 q30 0 30 30 v60 q0 30 -30 30 h-260 l-60 40 q-10 6 -14 -4 l-16 -46 h-100 q-60 0 -60 -60 z"
		  fill="#f1f7ff" stroke="#dbeeff" stroke-width="2"/>
	<circle cx="80" cy="140" r="6" fill="#cfe6ff" />
	<circle cx="140" cy="140" r="6" fill="#cfe6ff" />
	<circle cx="200" cy="140" r="6" fill="#cfe6ff" />
  </g>

  <!-- Right chat bubble -->
  <g transform="translate(340,300)">
	<path d="M240 0 q60 0 60 60 v80 q0 30 -30 30 h-380 q-30 0 -30 -30 v-140 q0 -60 60 -60 h320 q30 0 40 10 z"
		  fill="#e8f7ee" stroke="#d6f0df" stroke-width="2"/>
	<rect x="60" y="36" width="320" height="64" rx="8" fill="#fff" opacity="0.85" />
	<text x="220" y="78" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="28" fill="#2b6b3a">Hello! How can I help?</text>
  </g>

  <!-- Title -->
  <text x="600" y="80" text-anchor="middle" font-family="Verdana, Arial, sans-serif" font-size="48" font-weight="700" fill="#ffffff">Chatbot</text>

  <!-- Accent dots -->
  <g opacity="0.9">
	<circle cx="980" cy="160" r="18" fill="#ffffff" opacity="0.12" />
	<circle cx="1000" cy="220" r="10" fill="#ffffff" opacity="0.08" />
	<circle cx="920" cy="200" r="14" fill="#ffffff" opacity="0.10" />
  </g>

  <!-- Footer label -->
  <rect x="120" y="640" width="960" height="80" rx="18" fill="url(#g)" opacity="0.9" />
  <text x="600" y="690" text-anchor="middle" font-family="Arial, sans-serif" font-size="22" fill="#ffffff">A friendly, helpful assistant — built for your users</text>

</svg>
